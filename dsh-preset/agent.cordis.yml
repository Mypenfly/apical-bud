# The `apical-bud` (顶芽) agent preset: derive a need from the user's first
# action into a data-flow picture, then build the smallest thing that runs it.
#
# v2 is deliberately thin. The method lives in the skill (SKILL.md + three
# references); this file carries only the always-on contract and the tool set:
#   * PERSONA — the five priority layers, one line each; the "read SKILL.md
#     first" line; the per-turn contract (one action or one gap, one question,
#     write back only what the user accepted) and the resume recital. The method
#     body has one home, the skill. A second hand-copy is a second thing to drift.
#   * WRITE GUARD (apical-guard) — `write`/`edit` only inside a discussion root
#     (`design/<slug>/…`), and `seed.md`'s `## 用户原话` append-only. v2 keeps
#     both because they are what stops derivation from turning into
#     implementation drift and history rewriting. Both are anti-slip, not a
#     security boundary; `DSH_APICAL_UNLOCK=1` lifts them for one session.
#   * STATE BANNER (apical-guard) — one line per user turn, read off `seed.md`
#     and `flow.md`: core question, current state, open gaps, boundary answers.
#     A long discussion compacts; remembered state is state that eventually gets
#     remembered wrong.
#
# DELETED in v2, on purpose: the `apical_check` tool with its 66 KB check
# script, the 47 KB selftest, and the generated `map.md`. The method's hard
# items are now four (a seed with exactly one main chain, a flow with one
# complete path, a filled boundary section, a fresh 现状 line) and can be read
# by eye. A checker that costs more to maintain than it catches teaches people
# to ignore it.
#
# NOT MOUNTED: dsh-plan-mode (writing the record IS the work), goal tools (a
# derivation has to stop and wait for the user's answer), workflow/ralph (they
# fan out toward implementation), jobs (nothing long-running to collect here).
# One subagent stays for research and for a red-team read of a settled picture.
#
# A service row MUST sit inside a group carrying an `isolate` realm; this
# preset publishes no service, so only the compaction group needs one.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# The text slot is `prefix` (renamed from `text` in 0.1.3-alpha.2; the newer
# schema rejects `text`).
#
# Do NOT put a cwd placeholder or any other template variable here. Since dsh
# 0.2.1-rc.3 the prompt loop registers only the variables a plugin explicitly
# publishes, and the current working directory is supplied as literal user
# context by the working-directory service, not as a variable. An unregistered
# placeholder fails the whole prompt assembly before any model request:
# "unknown prompt variable ...; registered variables: provider, model".
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你运行在「顶芽模式」：和一个要把需求推成最小实现的用户共同推演。你是共同推演者兼对手，产出是推演本身，以及按动作链切出来的最小实现。

      **开工第一件事：读 skill 的 `SKILL.md`。** 下面只放每轮都必须记得的东西，方法本体只在那里。

      ## 优先级（冲突时高覆盖低，同级回来问）
      L0 不可交易：不虚构、不替他拍板、不预设架构、不越边界、不把未验证说成已验证。
      L1 范围：用户第一数据流（起点是他的动作，图上不留孤儿）、场景卡、边界三问。
      L2 达成：动作链闭环，他每一步看得见，失败有出口。
      L3 手段：任何「要自己写」的结论之前先查已有；覆盖与痛点两条都过才迁移，否则自研。
      L4 精简：前面都满足后取工程量最小。
      L5 记录与说话：只记必要、现状一行；一到五句、结论在前、不写公文。

      ## 每轮
      一次只推一个动作或一个缺口，一次只问一个要他答的问题。没认下的不写文件；认下的当轮写回 seed、flow 与现状。
      新会话或压缩之后：先读 `flow.md` 的「现状」，再用三句话复述——停在哪、上一轮定了什么、下一步做什么。

      推演期不写生产代码。实现放在推演会话还是换标准会话，按工程量定，见 `SKILL.md` 的「实现」。

# Project conventions still matter (naming, existing decisions, house style); the
# full digest is a large injected block, so half of standard's budget keeps the
# interesting part and drops the noise.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768

# ── shell (read-only forensics, research, and running the small implementation) ─

# `shell-env` and the sandbox/approval stack stay in the HOST composition.
# `bash` grounds claims in facts and runs the slices a small implementation
# needs; writing through it is forbidden by the persona and left to the sandbox
# policy, not by this row.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# The record is `design/<slug>/`; the write guard keeps write/edit inside it
# until the user lifts it for an in-session implementation.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

# `apical-bud` is installed in the user skill root (<dshHome>/skills), so the
# default root covers it and the method stays publishable as one folder.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── the guard and the banner (preset-local plugin) ──────────────────────────

# One plugin, two mechanisms: the monotonic write guard and the per-turn state
# banner. It reads `seed.md` and `flow.md` directly; there is no check engine
# and no generated map to keep in sync.
- id: apical-guard
  name: ./apical-guard.mjs
  config:
    base: design
    banner: true
    # Set DSH_APICAL_UNLOCK=1 in the host environment to lift the write guard
    # for one session (the in-session implementation path); `allowPaths`
    # whitelists extra cwd-relative prefixes for a long-lived project dir.
    allowPaths: []

# ── compaction ──────────────────────────────────────────────────────────────

# A derivation reads many documents over many rounds, so folding is not
# optional. `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
# pruner must share this entry-local realm rather than sit outside it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation (research and red-team reads) ────────────────────────────────

# The `subagents` registry and its backends live in the HOST composition; this
# row contributes the tool. The child cannot ask the user questions, which is
# exactly why the derivation itself must stay a top-level session.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# One question at a time is still the discipline here, so a single active todo is
# the honest mirror of it.
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

# The `web` service and its search provider stay in the host composition.
# Research is a first-class step in v2 (check before building), so search AND
# fetch are both on.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
