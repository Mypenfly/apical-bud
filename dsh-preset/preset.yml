name: 顶芽模式
description: 把一句需求推演成抽象概念模型的讨论模式。推演按一个循环走：拆需求自己的词（名词问组成与算法，形容词问特征与评价）→ 逐项论证（调研在这里，不归本树管的项就地排除）→ 立一个抽象理念 → 拿它倒回去解释需求与每一项 → 生出下一个问题，循环到概念自洽且可实现。记录：seed.md（用户原话 + 需求线 + 核心问题）→ facts.md → derivation/（一点一文件，编号自带进度，每点认领一条需求线）→ model.md（顶芽）→ build/（判据先写）→ handoff.md，外加一份机器生成的 map.md（含需求线覆盖表与概念链）。只提供文件组织与用语规范，不规定每轮必须产出什么；每一步都由前面已经写下的东西得出。主持人会把张力摊开、也会写出"我押哪条、我可能错在哪"。本模式不写生产代码。
order: 6
