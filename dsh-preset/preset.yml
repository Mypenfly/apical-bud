name: 顶芽模式
description: 把一句需求推演成抽象概念模型的讨论模式。第一步只留一个核心：把用户一口气要的几样摆出来，选恰好一个当核心，其余降为检验条件（超过 3 条提醒"要的太多"）或非目标，并写下放弃代价；推演按节点走——命名 → 组成 → 为什么 → 怎么落机制 → 生出新概念／新问题，节点可以无限长，但未定项必须被解决且不再增长（只增不减就是没在收敛）；理念自洽后进入技术选型：判据 → 方案 →（可选）实验 → 选型，实验允许推翻理念、也允许得出"这个需求不可行"；这一层只产出实验文件，用户换标准模式会话去跑。果实是 handoff.md（含验证状态：已证实／已被推翻／未验证）加能跑的实验文件与数据。记录：seed.md → facts.md → derivation/（一点一文件，编号自带进度，每点写 what 与 undecided）→ model.md → build/ → probe/ → handoff.md，外加一份机器生成的 map.md（含需求线覆盖表、概念链、未定项）。只提供文件组织与用语规范，不规定每轮必须产出什么；每一步都由前面已经写下的东西得出。主持人会把张力摊开、也会写出"我押哪条、我可能错在哪"。本模式不写生产代码。
order: 6
